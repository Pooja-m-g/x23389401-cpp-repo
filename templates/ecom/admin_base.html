<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style type="text/css">
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

* {
  font-family: 'Inter', sans-serif;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #f8f9fa;
  min-height: 100vh;
}

.admin-navbar {
  background: white !important;
  box-shadow: 0 2px 20px rgba(0,0,0,0.06);
  padding: 12px 0;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
}

.navbar-brand {
  font-size: 1.6rem;
  font-weight: 800;
  color: #2d3436 !important;
  display: flex;
  align-items: center;
  gap: 12px;
}

.navbar-brand i {
  background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.navbar-brand span {
  color: #FF6B35;
}

.nav-link {
  color: #636e72 !important;
  font-weight: 500;
  padding: 10px 20px !important;
  border-radius: 10px;
  transition: all 0.3s ease;
  margin: 0 3px;
}

.nav-link:hover {
  background: #f8f9fa;
  color: #FF6B35 !important;
}

.nav-link i {
  margin-right: 8px;
  color: #FF6B35;
}

.nav-link.active {
  background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
  color: white !important;
}

.nav-link.active i {
  color: white;
}

.logout-link {
  background: #fee2e2;
  color: #dc2626 !important;
}

.logout-link:hover {
  background: #fecaca !important;
  color: #dc2626 !important;
}

.content-wrapper {
  padding-top: 80px;
  min-height: calc(100vh - 80px);
}

/* Mobile */
@media (max-width: 768px) {
  .navbar-brand {
    font-size: 1.3rem;
  }
  
  .nav-link {
    padding: 8px 15px !important;
    font-size: 0.9rem;
  }
}
</style>
</head>

<body>
  <nav class="navbar navbar-expand-md admin-navbar">
    <div class="container-fluid">
      <a href="/" class="navbar-brand">
        <i class="fas fa-store"></i>
        Food<span>House</span>
      </a>
      <button type="button" class="navbar-toggler border-0" data-toggle="collapse" data-target="#navbarCollapse">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarCollapse">
        <div class="navbar-nav">
          <a href="/admin-dashboard" class="nav-link">
            <i class="fas fa-chart-pie"></i> Dashboard
          </a>
          <a href="/view-customer" class="nav-link">
            <i class="fas fa-users"></i> Customers
          </a>
          <a href="/admin-view-booking" class="nav-link">
            <i class="fas fa-shopping-bag"></i> Orders
          </a>
          <a href="/admin-products" class="nav-link">
            <i class="fas fa-utensils"></i> Products
          </a>
          <a href="/view-feedback" class="nav-link">
            <i class="fas fa-comments"></i> Feedback
          </a>
          <!--<a href="/logout/" class="nav-link logout-link"> -->
            <a href="{% url 'logout' %}">Logout</a>
            <i class="fas fa-sign-out-alt"></i> Logout
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="content-wrapper">
    {% block content %}
    {% endblock content %}
  </div>

  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
